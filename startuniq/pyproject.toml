[project]
name = "startuniq"
version = "0.0.5"
license = "BSD-3-Clause"
authors = [
  { name="Andrey Sukhanov", email="sukhanov@bnl.gov" },
]
description = "Start a remote program only if it is not already running, If it is running, ask the user whether to kill it or not."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
"Homepage" = "https://github.com/eicorg/scripts/tree/main/startuniq"
